<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Up!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f1a;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 800;
    color: #a78bfa;
    margin-bottom: 6px;
    letter-spacing: -1px;
  }

  .subtitle {
    color: #888;
    font-size: 0.9rem;
    margin-bottom: 30px;
  }

  .screen { width: 100%; max-width: 480px; }

  /* SETUP SCREEN */
  .setup-card {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .setup-card h2 {
    font-size: 1rem;
    color: #a78bfa;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  input[type="text"], input[type="number"] {
    flex: 1;
    background: #0f0f1a;
    border: 2px solid #2d2d4e;
    border-radius: 10px;
    padding: 12px 14px;
    color: #f0f0f0;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: #a78bfa; }

  .btn {
    background: #a78bfa;
    color: #0f0f1a;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .btn:active { transform: scale(0.96); }
  .btn:hover { background: #c4b5fd; }

  .btn-outline {
    background: transparent;
    color: #a78bfa;
    border: 2px solid #a78bfa;
  }

  .btn-outline:hover { background: #a78bfa22; }

  .btn-danger {
    background: transparent;
    color: #f87171;
    border: 2px solid #f87171;
    padding: 6px 12px;
    font-size: 0.8rem;
  }

  .btn-danger:hover { background: #f8717122; }

  .btn-big {
    width: 100%;
    padding: 16px;
    font-size: 1.1rem;
    border-radius: 14px;
    margin-top: 8px;
  }

  .player-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .player-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0f0f1a;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.95rem;
  }

  .score-config {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .score-config label { color: #ccc; font-size: 0.95rem; }
  .score-config input { width: 80px; flex: none; }

  /* DIFFICULTY SELECTOR */
  .diff-row {
    display: flex;
    gap: 8px;
  }

  .diff-btn {
    flex: 1;
    padding: 10px 6px;
    border-radius: 10px;
    border: 2px solid #2d2d4e;
    background: #0f0f1a;
    color: #888;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }

  .diff-btn:hover { border-color: #a78bfa55; color: #ccc; }
  .diff-btn.active-easy   { border-color: #34d399; color: #34d399; background: #34d39911; }
  .diff-btn.active-medium { border-color: #a78bfa; color: #a78bfa; background: #a78bfa11; }
  .diff-btn.active-hard   { border-color: #f87171; color: #f87171; background: #f8717111; }
  .diff-btn.active-mix    { border-color: #fbbf24; color: #fbbf24; background: #fbbf2411; }

  .diff-label {
    display: block;
    font-size: 0.68rem;
    font-weight: 400;
    margin-top: 3px;
    opacity: 0.7;
  }

  /* GAME SCREEN */
  .round-badge {
    background: #1a1a2e;
    border-radius: 30px;
    padding: 6px 16px;
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 16px;
    text-align: center;
  }

  .diff-indicator {
    display: inline-block;
    margin-left: 8px;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .diff-indicator.easy   { background: #34d39922; color: #34d399; }
  .diff-indicator.medium { background: #a78bfa22; color: #a78bfa; }
  .diff-indicator.hard   { background: #f8717122; color: #f87171; }
  .diff-indicator.mix    { background: #fbbf2422; color: #fbbf24; }

  .definition-card {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 16px;
  }

  .pos-tag {
    font-size: 0.75rem;
    color: #a78bfa;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .definition-text {
    font-size: 1.05rem;
    line-height: 1.6;
    color: #ddd;
    flex: 1;
  }

  .word-reveal {
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    background: #0f0f1a;
    border: 2px dashed #2d2d4e;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .word-reveal:hover { border-color: #a78bfa; }

  .word-reveal .tap-hint { color: #555; font-size: 0.85rem; }

  .hint-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 34px;
  }

  .hint-pattern {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 1.05rem;
    letter-spacing: 3px;
    color: #fbbf24;
  }

  .hint-btn {
    background: transparent;
    color: #fbbf24;
    border: 2px solid #fbbf2466;
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    flex: none;
  }

  .hint-btn:hover { background: #fbbf2411; }
  .hint-btn:disabled { opacity: 0.35; cursor: default; }

  .also-accept {
    color: #888;
    font-size: 0.8rem;
    margin-top: 6px;
  }

  .word-reveal .actual-word {
    font-size: 1.8rem;
    font-weight: 800;
    color: #a78bfa;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* PLAYERS SCORING */
  .players-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .player-score-row {
    background: #1a1a2e;
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .player-score-row:hover { border-color: #a78bfa44; }
  .player-score-row:active { transform: scale(0.97); border-color: #a78bfa; }

  .player-name-col { font-size: 1rem; font-weight: 600; }

  .score-col {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .score-num {
    font-size: 1.5rem;
    font-weight: 800;
    color: #a78bfa;
    min-width: 32px;
    text-align: right;
  }

  .plus-btn {
    background: #a78bfa;
    color: #0f0f1a;
    border: none;
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 1.3rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
  }

  .plus-btn:hover { background: #c4b5fd; }

  .minus-btn {
    background: #2d2d4e;
    color: #888;
    border: none;
    border-radius: 8px;
    width: 28px;
    height: 28px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
  }

  .minus-btn:hover { background: #3d3d5e; color: #ccc; }

  .action-row {
    display: flex;
    gap: 10px;
  }

  .action-row .btn { flex: 1; padding: 12px 8px; white-space: nowrap; }

  .progress-bar-wrap {
    background: #1a1a2e;
    border-radius: 8px;
    height: 6px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #a78bfa, #818cf8);
    border-radius: 8px;
    transition: width 0.4s ease;
  }

  /* WIN SCREEN */
  .win-screen { text-align: center; padding: 20px 0; }

  .trophy { font-size: 5rem; margin-bottom: 16px; }

  .win-name {
    font-size: 2rem;
    font-weight: 800;
    color: #fbbf24;
    margin-bottom: 8px;
  }

  .win-sub { color: #888; margin-bottom: 30px; }

  .final-scores {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
    text-align: left;
  }

  .final-score-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #2d2d4e;
    font-size: 1rem;
  }

  .final-score-row:last-child { border-bottom: none; }
  .final-score-row .fscore { font-weight: 700; color: #a78bfa; }

  /* CONFETTI */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -10px;
    animation: fall linear forwards;
    border-radius: 2px;
    pointer-events: none;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* SEGMENTED OPTIONS (reader mode, timer) */
  .option-label {
    color: #ccc;
    font-size: 0.85rem;
    margin: 4px 0 8px;
  }

  .option-label:not(:first-of-type) { margin-top: 16px; }

  .seg-row { display: flex; gap: 8px; }

  .seg-btn {
    flex: 1;
    padding: 9px 6px;
    border-radius: 10px;
    border: 2px solid #2d2d4e;
    background: #0f0f1a;
    color: #888;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }

  .seg-btn:hover { border-color: #a78bfa55; color: #ccc; }
  .seg-btn.active { border-color: #a78bfa; color: #a78bfa; background: #a78bfa11; }

  /* RESUME BANNER */
  .resume-card {
    background: #1a1a2e;
    border: 2px solid #fbbf2466;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }

  .resume-title { color: #fbbf24; font-weight: 800; margin-bottom: 4px; }
  .resume-detail { color: #aaa; font-size: 0.9rem; margin-bottom: 14px; }
  .resume-card .action-row .btn { padding: 10px; }

  /* READER + TIMER */
  .reader-banner {
    text-align: center;
    color: #ccc;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }

  .reader-banner strong { color: #a78bfa; }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .card-top .pos-tag { margin-bottom: 0; }

  .timer-pill {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 0.85rem;
    color: #a78bfa;
    background: #a78bfa1a;
    border-radius: 20px;
    padding: 3px 10px;
    transition: color 0.2s, background 0.2s;
  }

  .timer-pill.urgent { color: #f87171; background: #f871711f; }
  .timer-pill.done { color: #888; background: #2d2d4e; }

  .timer-track {
    height: 4px;
    background: #0f0f1a;
    border-radius: 4px;
    overflow: hidden;
  }

  .timer-fill {
    height: 100%;
    width: 100%;
    background: #a78bfa;
    transition: width 0.25s linear, background 0.2s;
  }

  .timer-fill.urgent { background: #f87171; }

  .player-score-row.is-reader {
    opacity: 0.5;
    cursor: default;
  }

  .player-score-row.is-reader:hover,
  .player-score-row.is-reader:active { border-color: transparent; transform: none; }

  .row-tag {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    margin-left: 8px;
  }

  .leader-mark { margin-left: 6px; }

  .btn:disabled { opacity: 0.35; cursor: default; transform: none; }

  .hidden { display: none !important; }

  @media (max-width: 400px) {
    h1 { font-size: 1.8rem; }
    .definition-text { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<h1>Word Up!</h1>
<p class="subtitle">Read the definition. Guess the word. Win.</p>

<!-- SETUP SCREEN -->
<div class="screen" id="setupScreen">
  <div class="resume-card hidden" id="resumeCard">
    <div class="resume-title">Game in progress</div>
    <div class="resume-detail" id="resumeDetail"></div>
    <div class="action-row">
      <button class="btn" onclick="resumeGame()">Resume</button>
      <button class="btn btn-outline" onclick="discardSavedGame()">Start over</button>
    </div>
  </div>

  <div class="setup-card">
    <h2>Players</h2>
    <div class="input-row">
      <input type="text" id="playerInput" placeholder="Enter player name" maxlength="20" />
      <button class="btn" onclick="addPlayer()">Add</button>
    </div>
    <div class="player-list" id="playerList"></div>
  </div>

  <div class="setup-card">
    <h2>Difficulty</h2>
    <div class="diff-row">
      <button class="diff-btn active-easy" id="diff-easy" onclick="setDifficulty('easy')">
        Easy
        <span class="diff-label">Everyday stuff</span>
      </button>
      <button class="diff-btn" id="diff-medium" onclick="setDifficulty('medium')">
        Medium
        <span class="diff-label">Modern life</span>
      </button>
      <button class="diff-btn" id="diff-hard" onclick="setDifficulty('hard')">
        Hard
        <span class="diff-label">Big ideas</span>
      </button>
      <button class="diff-btn" id="diff-mix" onclick="setDifficulty('mix')">
        Mix
        <span class="diff-label">A bit of all</span>
      </button>
    </div>
  </div>

  <div class="setup-card">
    <h2>Rounds</h2>
    <div class="option-label">Who reads the clue?</div>
    <div class="seg-row">
      <button class="seg-btn active" data-reader="turns" onclick="setReaderMode('turns')">Take turns</button>
      <button class="seg-btn" data-reader="host" onclick="setReaderMode('host')">One host</button>
    </div>
    <div class="option-label">Timer per word</div>
    <div class="seg-row">
      <button class="seg-btn active" data-timer="0" onclick="setTimer(0)">Off</button>
      <button class="seg-btn" data-timer="30" onclick="setTimer(30)">30s</button>
      <button class="seg-btn" data-timer="45" onclick="setTimer(45)">45s</button>
      <button class="seg-btn" data-timer="60" onclick="setTimer(60)">60s</button>
    </div>
  </div>

  <div class="setup-card">
    <h2>Win Condition</h2>
    <div class="score-config">
      <label>First to</label>
      <input type="number" id="targetScore" value="10" min="1" max="100" />
      <label>points wins</label>
    </div>
  </div>

  <button class="btn btn-big" onclick="startGame()">Start Game</button>
</div>

<!-- GAME SCREEN -->
<div class="screen hidden" id="gameScreen">
  <div class="round-badge" id="roundBadge">Round 1</div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>

  <div class="reader-banner hidden" id="readerBanner"></div>

  <div class="definition-card">
    <div>
      <div class="card-top">
        <div class="pos-tag" id="posTag"></div>
        <div class="timer-pill hidden" id="timerPill"></div>
      </div>
      <div class="definition-text" id="definitionText"></div>
    </div>
    <div class="timer-track hidden" id="timerTrack"><div class="timer-fill" id="timerFill"></div></div>
    <div class="hint-row">
      <div class="hint-pattern" id="hintPattern"></div>
      <button class="hint-btn" id="hintBtn" onclick="showHint()">Hint</button>
    </div>
    <div class="word-reveal" id="wordReveal" onclick="toggleReveal()">
      <div class="tap-hint" id="revealHint">Tap to reveal the word</div>
      <div class="hidden" id="answerBox">
        <div class="actual-word" id="actualWord"></div>
        <div class="also-accept hidden" id="alsoAccept"></div>
      </div>
    </div>
  </div>

  <div class="players-grid" id="playersGrid"></div>

  <div class="action-row">
    <button class="btn btn-outline" onclick="nextWord()">Next Word</button>
    <button class="btn btn-outline" id="undoBtn" onclick="undoLast()" disabled>Undo</button>
    <button class="btn btn-danger btn-outline" onclick="endGame()">End Game</button>
  </div>
</div>

<!-- WIN SCREEN -->
<div class="screen hidden" id="winScreen">
  <div class="win-screen">
    <div class="trophy">🏆</div>
    <div class="win-name" id="winnerName"></div>
    <div class="win-sub" id="winSub"></div>
    <div class="final-scores" id="finalScores"></div>
    <button class="btn btn-big" onclick="resetToSetup()">Play Again</button>
  </div>
</div>

<script src="words.js"></script>
<script>
// ─── Word bank (see words.js) ──────────────────────────────────────────────
const LEVELS = ["easy", "medium", "hard"];
const DIFF_LABELS = { easy: "Easy", medium: "Medium", hard: "Hard", mix: "Mix" };
const SEEN_KEY = "wordup.seen.v1";

function poolFor(level) {
  if (level === "mix") return LEVELS.flatMap(l => WORD_BANK[l]);
  return WORD_BANK[level];
}

// Words already shown, remembered across games (and reloads) so the same group
// doesn't see repeats until they've been through the whole list.
function loadSeen() {
  try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)) || []); }
  catch { return new Set(); }
}

function saveSeen() {
  try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seenWords])); }
  catch { /* storage unavailable — repeats just reset on reload */ }
}

function drawWord() {
  const pool = poolFor(difficulty);
  let fresh = pool.filter(e => !seenWords.has(e.word));
  if (fresh.length === 0) {
    // Everything in this pool has been played — start the cycle over,
    // but never repeat the word that's on screen right now.
    pool.forEach(e => seenWords.delete(e.word));
    fresh = pool.filter(e => !current || e.word !== current.word);
  }
  const pick = fresh[Math.floor(Math.random() * fresh.length)];
  seenWords.add(pick.word);
  saveSeen();
  return pick;
}

// ─── State ─────────────────────────────────────────────────────────────────
const SETUP_KEY = "wordup.setup.v1";
const GAME_KEY = "wordup.game.v1";

let players = [];
let scores = {};
let targetScore = 10;
let difficulty = "easy";
let readerMode = "turns";   // "turns": players take turns reading; "host": a non-player reads
let timerSeconds = 0;       // 0 = no timer
let roundCount = 0;
let readerIdx = -1;
let wordRevealed = false;
let hintLevel = 0;
let current = null;
let scoreLog = [];          // [{ name, delta }] for Undo
const seenWords = loadSeen();

function store(key, value) {
  try {
    if (value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, JSON.stringify(value));
  } catch { /* storage unavailable — game still works, just isn't saved */ }
}

function fetchStored(key) {
  try { return JSON.parse(localStorage.getItem(key)); }
  catch { return null; }
}

// ─── Setup options ─────────────────────────────────────────────────────────
function setDifficulty(level) {
  difficulty = level;
  ["easy", "medium", "hard", "mix"].forEach(d => {
    const btn = document.getElementById("diff-" + d);
    btn.className = "diff-btn" + (d === level ? " active-" + d : "");
  });
  saveSetup();
}

function setReaderMode(mode) {
  readerMode = mode;
  document.querySelectorAll("[data-reader]").forEach(b => b.classList.toggle("active", b.dataset.reader === mode));
  saveSetup();
}

function setTimer(seconds) {
  timerSeconds = seconds;
  document.querySelectorAll("[data-timer]").forEach(b => b.classList.toggle("active", Number(b.dataset.timer) === seconds));
  saveSetup();
}

// The last group and settings are remembered so game night #2 is one tap.
function saveSetup() {
  if (restoring) return;
  store(SETUP_KEY, {
    players, difficulty, readerMode, timerSeconds,
    targetScore: parseInt(document.getElementById("targetScore").value, 10) || 10
  });
}

let restoring = false;

function restoreSetup() {
  const saved = fetchStored(SETUP_KEY);
  if (!saved) return;
  restoring = true;
  if (Array.isArray(saved.players)) {
    players = saved.players.filter(p => typeof p === "string").slice(0, 20);
    players.forEach(p => scores[p] = 0);
  }
  if (DIFF_LABELS[saved.difficulty]) setDifficulty(saved.difficulty);
  if (saved.readerMode === "turns" || saved.readerMode === "host") setReaderMode(saved.readerMode);
  if ([0, 30, 45, 60].includes(saved.timerSeconds)) setTimer(saved.timerSeconds);
  if (saved.targetScore > 0) document.getElementById("targetScore").value = saved.targetScore;
  restoring = false;
  renderPlayerList();
}

// ─── Players ───────────────────────────────────────────────────────────────
document.getElementById("playerInput").addEventListener("keydown", e => {
  if (e.key === "Enter") addPlayer();
});
document.getElementById("targetScore").addEventListener("change", saveSetup);

function addPlayer() {
  const input = document.getElementById("playerInput");
  const name = input.value.trim().replace(/\s+/g, " ");
  if (!name) return;
  if (players.some(p => p.toLowerCase() === name.toLowerCase())) { input.value = ""; return; }
  players.push(name);
  scores[name] = 0;
  input.value = "";
  renderPlayerList();
  saveSetup();
}

function removePlayer(name) {
  players = players.filter(p => p !== name);
  delete scores[name];
  renderPlayerList();
  saveSetup();
}

// Player names are user input: always render them with textContent,
// never by splicing them into HTML or onclick strings.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function renderPlayerList() {
  const list = document.getElementById("playerList");
  list.replaceChildren(...players.map(p => {
    const chip = el("div", "player-chip");
    const btn = el("button", "btn btn-danger", "Remove");
    btn.addEventListener("click", () => removePlayer(p));
    chip.append(el("span", "", p), btn);
    return chip;
  }));
}

// ─── Start / resume ────────────────────────────────────────────────────────
function startGame() {
  if (players.length < 2) {
    alert("Add at least 2 players to start!");
    return;
  }
  const t = parseInt(document.getElementById("targetScore").value, 10);
  if (!t || t < 1) { alert("Set a valid winning score."); return; }
  targetScore = t;
  saveSetup();

  players.forEach(p => scores[p] = 0);
  roundCount = 0;
  readerIdx = readerMode === "turns" ? Math.floor(Math.random() * players.length) - 1 : -1;
  scoreLog = [];
  current = null;

  enterGameScreen();
  loadWord();
}

function enterGameScreen() {
  hide("setupScreen");
  hide("winScreen");
  show("gameScreen");
  unlockAudio();
  keepScreenAwake();
  renderScoreGrid();
  updateProgress();
  updateUndo();
}

function savedGame() {
  const g = fetchStored(GAME_KEY);
  if (!g || !Array.isArray(g.players) || g.players.length < 2 || !g.word) return null;
  const entry = LEVELS.flatMap(l => WORD_BANK[l]).find(e => e.word === g.word);
  return entry ? { ...g, entry } : null;
}

function showResumeOffer() {
  const g = savedGame();
  if (!g) { hide("resumeCard"); return; }
  const ranked = [...g.players].sort((a, b) => (g.scores[b] || 0) - (g.scores[a] || 0));
  document.getElementById("resumeDetail").textContent =
    `Round ${g.roundCount} · ${ranked.map(p => `${p} ${g.scores[p] || 0}`).join(", ")} · first to ${g.targetScore}`;
  show("resumeCard");
}

function resumeGame() {
  const g = savedGame();
  if (!g) { hide("resumeCard"); return; }
  players = g.players;
  scores = {};
  players.forEach(p => scores[p] = Number(g.scores[p]) || 0);
  targetScore = g.targetScore;
  difficulty = DIFF_LABELS[g.difficulty] ? g.difficulty : "easy";
  readerMode = g.readerMode === "host" ? "host" : "turns";
  timerSeconds = [0, 30, 45, 60].includes(g.timerSeconds) ? g.timerSeconds : 0;
  roundCount = g.roundCount;
  readerIdx = g.readerIdx;
  scoreLog = Array.isArray(g.scoreLog) ? g.scoreLog : [];

  enterGameScreen();
  showWord(g.entry);
}

function discardSavedGame() {
  store(GAME_KEY, null);
  hide("resumeCard");
}

function saveGame() {
  if (!current) return;
  store(GAME_KEY, {
    players, scores, targetScore, difficulty, readerMode, timerSeconds,
    roundCount, readerIdx, scoreLog: scoreLog.slice(-50), word: current.word
  });
}

// ─── Rounds ────────────────────────────────────────────────────────────────
function currentReader() {
  return readerMode === "turns" && readerIdx >= 0 ? players[readerIdx % players.length] : null;
}

function loadWord() {
  roundCount++;
  if (readerMode === "turns") readerIdx = (readerIdx + 1) % players.length;
  showWord(drawWord());
}

function showWord(entry) {
  current = entry;
  wordRevealed = false;
  hintLevel = 0;

  document.getElementById("posTag").textContent = current.pos;
  document.getElementById("definitionText").textContent = current.clue;
  document.getElementById("actualWord").textContent = current.word.toUpperCase();

  const also = document.getElementById("alsoAccept");
  also.textContent = current.alt && current.alt.length ? "Also accept: " + current.alt.join(", ") : "";
  also.classList.toggle("hidden", !also.textContent);

  document.getElementById("hintPattern").textContent = "";
  document.getElementById("hintBtn").disabled = false;
  document.getElementById("hintBtn").textContent = "Hint";
  setRevealed(false);

  document.getElementById("roundBadge").replaceChildren(
    document.createTextNode(`Round ${roundCount} `),
    el("span", "diff-indicator " + difficulty, DIFF_LABELS[difficulty])
  );

  const reader = currentReader();
  const banner = document.getElementById("readerBanner");
  banner.classList.toggle("hidden", !reader);
  if (reader) banner.replaceChildren(el("strong", "", reader), document.createTextNode(" reads this one — everyone else guesses"));

  renderScoreGrid();
  startTimer();
  saveGame();
}

function nextWord() { loadWord(); }

// "procrastinate" -> hint 1: "_ _ _ _ …" (13 letters), hint 2: "P _ _ _ …"
function hintPattern(word, revealFirst) {
  let first = true;
  return [...word.toUpperCase()].map(ch => {
    if (!/[A-Z]/.test(ch)) return ch === " " ? "  " : ch;
    if (first) { first = false; if (revealFirst) return ch; }
    return "_";
  }).join(" ");
}

function showHint() {
  if (!current || hintLevel >= 2) return;
  hintLevel++;
  const letters = current.word.replace(/[^a-z]/gi, "").length;
  document.getElementById("hintPattern").textContent =
    hintPattern(current.word, hintLevel >= 2) + (hintLevel === 1 ? `  (${letters})` : "");
  const btn = document.getElementById("hintBtn");
  btn.textContent = hintLevel === 1 ? "First letter" : "Hint";
  btn.disabled = hintLevel >= 2;
}

function setRevealed(on) {
  wordRevealed = on;
  document.getElementById("revealHint").classList.toggle("hidden", on);
  document.getElementById("answerBox").classList.toggle("hidden", !on);
  document.getElementById("wordReveal").style.borderColor = on ? "#a78bfa" : "";
}

function toggleReveal() {
  if (!current) return;
  setRevealed(!wordRevealed);
}

// ─── Timer ─────────────────────────────────────────────────────────────────
let timerInterval = null;
let timerDeadline = 0;
let lastBeepSecond = null;

function startTimer() {
  stopTimer();
  const on = timerSeconds > 0;
  document.getElementById("timerPill").classList.toggle("hidden", !on);
  document.getElementById("timerTrack").classList.toggle("hidden", !on);
  if (!on) return;
  timerDeadline = Date.now() + timerSeconds * 1000;
  lastBeepSecond = null;
  tickTimer();
  timerInterval = setInterval(tickTimer, 200);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function tickTimer() {
  const msLeft = Math.max(0, timerDeadline - Date.now());
  const secs = Math.ceil(msLeft / 1000);
  const urgent = secs <= 5;
  const pill = document.getElementById("timerPill");
  const fill = document.getElementById("timerFill");
  pill.textContent = `0:${String(secs).padStart(2, "0")}`;
  pill.className = "timer-pill" + (urgent ? " urgent" : "");
  fill.style.width = (msLeft / (timerSeconds * 1000)) * 100 + "%";
  fill.classList.toggle("urgent", urgent);

  if (urgent && secs > 0 && secs !== lastBeepSecond) {
    lastBeepSecond = secs;
    beep(880, 0.08);
  }
  if (msLeft === 0) {
    stopTimer();
    pill.textContent = "Time's up";
    pill.className = "timer-pill done";
    beep(330, 0.45);
    setRevealed(true);
  }
}

// Freeze the clock where it is (someone got it) without showing "time's up".
function freezeTimer() {
  if (!timerInterval) return;
  stopTimer();
  document.getElementById("timerPill").className = "timer-pill done";
}

// ─── Sound + screen wake ───────────────────────────────────────────────────
let audioCtx = null;

// Browsers only allow audio after a tap, so this runs from Start/Resume.
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch { audioCtx = null; }
}

function beep(freq, duration) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch { /* no sound is fine */ }
}

let wakeLock = null;

// Stop the phone from dimming and locking mid-round.
async function keepScreenAwake() {
  try {
    if ("wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch { /* not supported or denied */ }
}

function releaseScreen() {
  if (wakeLock) wakeLock.release().catch(() => {});
  wakeLock = null;
}

document.addEventListener("visibilitychange", () => {
  const playing = !document.getElementById("gameScreen").classList.contains("hidden");
  if (document.visibilityState === "visible" && playing) keepScreenAwake();
});

// ─── Scoring ───────────────────────────────────────────────────────────────
function addPoint(name) {
  if (name === currentReader()) return;
  scores[name]++;
  scoreLog.push({ name, delta: 1 });
  // Someone got it: stop the clock and show everyone the answer.
  freezeTimer();
  setRevealed(true);
  afterScoreChange();
  if (scores[name] >= targetScore) showWinner([name]);
}

function removePoint(name) {
  if (scores[name] <= 0) return;
  scores[name]--;
  scoreLog.push({ name, delta: -1 });
  afterScoreChange();
}

function undoLast() {
  const last = scoreLog.pop();
  if (!last || !(last.name in scores)) return;
  scores[last.name] = Math.max(0, scores[last.name] - last.delta);
  afterScoreChange();
}

function afterScoreChange() {
  renderScoreGrid();
  updateProgress();
  updateUndo();
  saveGame();
}

function updateUndo() {
  document.getElementById("undoBtn").disabled = scoreLog.length === 0;
}

function updateProgress() {
  const max = Math.max(0, ...players.map(p => scores[p]));
  const pct = Math.min((max / targetScore) * 100, 100);
  document.getElementById("progressBar").style.width = pct + "%";
}

function rankedPlayers() {
  return [...players].sort((a, b) => scores[b] - scores[a]);
}

// Rows stay in join order during play (re-sorting after every point made
// people tap the wrong row); the leader gets a crown instead.
function renderScoreGrid() {
  const top = Math.max(0, ...players.map(p => scores[p]));
  const reader = currentReader();
  const grid = document.getElementById("playersGrid");
  grid.replaceChildren(...players.map(p => {
    const isReader = p === reader;
    const row = el("div", "player-score-row" + (isReader ? " is-reader" : ""));
    if (!isReader) row.addEventListener("click", () => addPoint(p));

    const nameCol = el("div", "player-name-col", p);
    if (top > 0 && scores[p] === top) nameCol.append(el("span", "leader-mark", "👑"));
    if (isReader) nameCol.append(el("span", "row-tag", "reading"));

    const minus = el("button", "minus-btn", "−");
    minus.setAttribute("aria-label", `Take a point from ${p}`);
    minus.addEventListener("click", e => { e.stopPropagation(); removePoint(p); });

    const scoreCol = el("div", "score-col");
    scoreCol.append(minus, el("div", "score-num", String(scores[p])));
    if (!isReader) scoreCol.append(el("div", "plus-btn", "+"));
    row.append(nameCol, scoreCol);
    return row;
  }));
}

function endGame() {
  if (!confirm("End the game early?")) return;
  const top = Math.max(...players.map(p => scores[p]));
  showWinner(players.filter(p => scores[p] === top), true);
}

// ─── Win ───────────────────────────────────────────────────────────────────
function joinNames(names) {
  if (names.length <= 2) return names.join(" & ");
  return names.slice(0, -1).join(", ") + " & " + names[names.length - 1];
}

function showWinner(winners, early = false) {
  stopTimer();
  releaseScreen();
  store(GAME_KEY, null);
  hide("gameScreen");
  show("winScreen");

  const tie = winners.length > 1;
  const pts = scores[winners[0]];
  document.getElementById("winnerName").textContent =
    tie ? `It's a tie!` : `${winners[0]} wins!`;
  document.getElementById("winSub").textContent = tie
    ? `${joinNames(winners)} finished level with ${pts} point${pts === 1 ? "" : "s"}.`
    : early
      ? `Game ended early — ${winners[0]} was in the lead.`
      : `First to ${targetScore} points. Impressive.`;

  const box = document.getElementById("finalScores");
  const heading = el("div", "", "Final Scores");
  heading.style.cssText = "font-size:0.75rem;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px";
  box.replaceChildren(heading, ...rankedPlayers().map(p => {
    const row = el("div", "final-score-row");
    row.append(el("span", "", p), el("span", "fscore", String(scores[p])));
    return row;
  }));

  launchConfetti();
}

function resetToSetup() {
  players.forEach(p => scores[p] = 0);
  roundCount = 0;
  current = null;
  scoreLog = [];
  hide("winScreen");
  show("setupScreen");
  renderPlayerList();
  showResumeOffer();
}

// ─── Confetti ──────────────────────────────────────────────────────────────
function launchConfetti() {
  const colors = ["#a78bfa","#818cf8","#fbbf24","#34d399","#f87171","#60a5fa"];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = Math.random() * 100 + "vw";
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.5 + Math.random() * 2) + "s";
    el.style.animationDelay = (Math.random() * 0.8) + "s";
    el.style.width = (6 + Math.random() * 8) + "px";
    el.style.height = (6 + Math.random() * 8) + "px";
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
}

// ─── Helpers ───────────────────────────────────────────────────────────────
function show(id) { document.getElementById(id).classList.remove("hidden"); }
function hide(id) { document.getElementById(id).classList.add("hidden"); }

// ─── Boot ──────────────────────────────────────────────────────────────────
restoreSetup();
showResumeOffer();
</script>
</body>
</html>
